    <style>
        :root {
            --bg-color: #0d0d0d;
            --logo-color: #b07e86; /* Rosa/Malva del tuo logo */
            --card-bg: #161616;

            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: rgba(176, 126, 134, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        header {
            text-align: center;
            padding: 35px 20px 15px;
            background: linear-gradient(to bottom, #141414, var(--bg-color));
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container {
            max-width: 200px;
            margin: 0 auto 15px;
        }

        .logo-container img {
            width: 100%;
            height: auto;
        }

        .header-actions {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        </div>
        .action-btn {
            background: transparent;
            border: 1px solid var(--logo-color);
            color: var(--logo-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .action-btn:hover {
            background: var(--logo-color);
            color: var(--bg-color);
        }
